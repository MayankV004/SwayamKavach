events {
    worker_connections 1024;
}

http {
    # Weighted upstream split between Slot A and Slot B
    # Default is 100% Slot A (Champion), 0% Slot B (Candidate)
    # The deployment controller adjusts weights during guarded canary: 5% -> 25% -> 50% -> 100%
    upstream model_serving {
        server 127.0.0.1:8001 weight=100 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 weight=0 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name localhost;

        location /predict {
            proxy_pass http://model_serving;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /health {
            return 200 '{"status": "nginx-router-healthy"}';
            add_header Content-Type application/json;
        }
    }
}
